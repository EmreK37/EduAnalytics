name: .NET WPF CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore EduAnalytics/EduAnalytics.sln

    - name: Build
      run: dotnet build EduAnalytics/EduAnalytics.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test EduAnalytics/EduAnalytics.sln --configuration Release --no-build --verbosity normal
